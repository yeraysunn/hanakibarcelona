<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de sellos · Hanaki</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sellos Hanaki">
<link rel="icon" type="image/png" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="/admin/i18n.js"></script>
<script src="config.js"></script>
<style>
#idioma{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid rgba(243,238,230,.35);color:var(--txt-hi);padding:9px 12px;font-size:12px;font-weight:600;letter-spacing:.08em;cursor:pointer}#idioma:hover{border-color:var(--oro);color:var(--oro)}#idioma span{font:inherit;letter-spacing:inherit;color:inherit}
.wrap{max-width:760px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 18px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{border:1px solid var(--linea);background:var(--bg2);padding:14px}
.st b{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;line-height:1;color:var(--txt-hi)}
.st small{display:block;font-size:11px;letter-spacing:.14em;margin-top:6px;color:var(--oro2)}
.st em{font-style:normal;font-size:12px;color:var(--muted)}
.barra{display:flex;gap:10px;margin-bottom:14px}
.barra input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--linea);color:var(--txt-hi);padding:13px 14px;outline:none}
.barra input:focus{border-color:var(--oro)}
.lista{display:flex;flex-direction:column;gap:8px}
.soc{border:1px solid var(--linea);background:var(--bg2);padding:14px;display:grid;grid-template-columns:1fr;gap:12px}
.soc.sel{border-color:var(--oro)}
.soc h3{margin:0;font-size:16px;font-weight:600;color:var(--txt-hi)}
.soc p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.tipos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbtn{flex-direction:column;gap:5px;padding:12px 4px;letter-spacing:.14em}
.tbtn b{font-size:11px;font-weight:600;letter-spacing:.14em}
.tbtn span{font-size:16px;font-weight:500;letter-spacing:.02em}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acc .btn{padding:13px 8px;font-size:11px;letter-spacing:.14em}
.chip{display:inline-block;background:var(--rojo);color:#fff;font-size:10px;font-weight:600;letter-spacing:.12em;padding:3px 7px;margin-left:6px;vertical-align:2px}
#cam{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .marco{position:absolute;left:50%;top:42%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--oro);box-shadow:0 0 0 2000px rgba(0,0,0,.45);pointer-events:none}
#cam .pie{padding:16px 16px max(16px,env(safe-area-inset-bottom));display:flex;gap:10px;flex-direction:column;background:#000}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#141414;border:1px solid var(--oro);color:var(--txt-hi);padding:14px 18px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 20px 50px rgba(0,0,0,.6);text-align:center}
#toast.ok{border-color:#3C9A5F}#toast.mal{border-color:var(--rojo-hi)}
#ficha,#sellar{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
#ficha .hoja,#sellar .hoja{width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--bg2);border:1px solid var(--linea);border-bottom:none;padding:20px 18px max(20px,env(safe-area-inset-bottom))}
@media(min-width:620px){#ficha,#sellar{align-items:center}#ficha .hoja,#sellar .hoja{border-bottom:1px solid var(--linea)}}
#ficha .fcab,#sellar .fcab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
#ficha h2,#sellar h2{margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:30px;line-height:1.1;color:var(--txt-hi)}
#ficha .x,#sellar .x{background:none;border:1px solid var(--linea);color:var(--txt-hi);width:40px;height:40px;font-size:20px;cursor:pointer;flex:none}
.datos{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:0 0 18px;border-top:1px solid var(--linea);padding-top:14px}
.datos dt{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--oro2);padding-top:2px}
.datos dd{margin:0;color:var(--txt-hi);word-break:break-word}
.datos dd a{color:var(--txt-hi)}
.hist-tit{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--oro2);border-bottom:1px solid var(--linea);padding-bottom:8px;margin-bottom:6px;display:flex;justify-content:space-between}
.hist{list-style:none;margin:0 0 20px;padding:0;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(243,238,230,.06)}
.hist .t-sello{color:#5FB37A}.hist .t-quitar{color:#E36B74}.hist .t-canje{color:var(--oro)}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums}
.btn.borrar{background:none;border-color:rgba(209,26,42,.6);color:#F5C9CD}
.btn.borrar:hover{background:var(--rojo);color:var(--txt-hi)}
.ftipos{margin:0 0 20px}
.ftipos .fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(243,238,230,.06);font-size:14px;color:var(--txt-hi)}
.ftipos .fila .btn{width:auto;padding:9px 18px;font-size:12px;letter-spacing:.1em}
.vacio{border:1px dashed var(--linea);padding:28px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main class="wrap">
  <header class="cab"><a href="/admin/"><img src="../assets/hanaki-logo.png" alt="花木"><span>HANAKI</span></a><div style="display:flex;gap:8px"><button type="button" id="idioma"></button><button id="salir" class="btn sec" style="width:auto;padding:10px 14px;font-size:10px" hidden>SALIR</button></div></header>

  <!-- Panel -->
  <section id="panel" hidden>
    <nav class="tabs" style="display:flex;gap:8px;margin-bottom:20px"><a href="/reservas/admin.html" style="flex:1;text-align:center;padding:12px;border:1px solid var(--linea);color:var(--txt);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.2em">RESERVAS</a><a href="/fidelidad/admin.html" aria-current="page" style="flex:1;text-align:center;padding:12px;border:1px solid var(--oro);color:var(--oro);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.2em">FIDELIZACIÓN</a></nav>
    <div class="stats">
      <div class="st"><b id="s-socios">–</b><small>SOCIOS</small><em id="s-nuevos"></em></div>
      <div class="st"><b id="s-hoy">–</b><small>SELLOS HOY</small><em id="s-total"></em></div>
      <div class="st"><b id="s-pend">–</b><small>PREMIOS LISTOS</small><em>por canjear</em></div>
      <div class="st"><b id="s-canj">–</b><small>CANJEADOS</small><em id="s-canjhoy"></em></div>
    </div>

    <button id="escanear" class="btn" style="margin-bottom:12px;padding:18px">ESCANEAR TARJETA <span aria-hidden="true">⌖</span></button>
    <div class="barra"><input id="buscar" type="search" placeholder="Buscar por nombre, teléfono o código" autocomplete="off"><button id="exportar" class="btn sec" style="width:auto;padding:0 14px;font-size:10px" title="Descargar CSV">CSV</button></div>
    <div id="lista" class="lista"></div>
  </section>
</main>

<div id="cam" hidden>
  <video id="video" playsinline muted></video><div class="marco"></div>
  <div class="pie"><div id="cam-msg" class="nota" style="text-align:center">Apunta al QR de la tarjeta del cliente</div><button id="cerrar-cam" class="btn sec">CERRAR</button></div>
</div>
<div id="ficha" hidden>
  <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="f-nombre">
    <div class="fcab"><div><div class="etq">Ficha del cliente</div><h2 id="f-nombre"></h2></div><button type="button" class="x" id="f-cerrar" aria-label="Cerrar">×</button></div>
    <dl class="datos" id="f-datos"></dl>
    <div class="hist-tit"><span>Corregir sellos</span></div>
    <div class="ftipos" id="f-tipos"></div>
    <div class="hist-tit"><span>Historial de sellos</span><span id="f-nmov"></span></div>
    <ul class="hist" id="f-hist"></ul>
    <button type="button" class="btn borrar" id="f-borrar">BORRAR CLIENTE</button>
  </div>
</div>
<div id="sellar" hidden>
  <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="s-nombre">
    <div class="fcab"><div><div class="etq">Sellar tarjeta</div><h2 id="s-nombre"></h2></div><button type="button" class="x" id="s-cerrar" aria-label="Cerrar">×</button></div>
    <p class="nota" style="margin:0 0 14px">Elige qué ha tomado el cliente</p>
    <div class="tipos" id="s-tipos"></div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
(function(){
  var OBJ = (window.HK_FID || {}).objetivo || 8;
  // Tres tipos de sello, cada uno con su contador y su premio (la lista real llega del servidor en cargar())
  var TIPOS = [{ id: 'mediodia', nombre: 'Buffet mediodía' }, { id: 'noche', nombre: 'Buffet noche' }, { id: 'menu', nombre: 'Menú' }];
  var CORTO = { mediodia: 'MEDIODÍA', noche: 'NOCHE', menu: 'MENÚ' };
  function nombreTipo(id){ var t = TIPOS.find(function(x){ return x.id === id; }); return T(t ? t.nombre : id); }
  function sellosDe(s, id){ return s['sellos_' + id] || 0; }
  function hayListo(s){ return TIPOS.some(function(t){ return sellosDe(s, t.id) >= OBJ; }); }
  // Un botón por tipo: +1 sello, o CANJEAR si ese contador ya está lleno
  function botonesTipos(s){
    return TIPOS.map(function(t){
      var n = sellosDe(s, t.id), listo = n >= OBJ;
      return '<button class="btn tbtn' + (listo ? ' oro' : '') + '" data-a="' + (listo ? 'canjear' : 'sello') + '" data-tipo="' + esc(t.id) + '">' +
        '<b>' + T(CORTO[t.id] || t.nombre.toUpperCase()) + '</b><span>' + (listo ? T('CANJEAR') : '+1 · ' + n + '/' + OBJ) + '</span></button>';
    }).join('');
  }
  var $ = function(id){ return document.getElementById(id); };
  var datos = [], seleccionado = null;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var tt; function toast(m, tipo){ var t = $('toast'); t.textContent = T(m); t.className = tipo || ''; t.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ t.hidden = true; }, 3200); }

  async function api(ruta, opt){
    var r = await fetch('/api/fidelidad/admin/' + ruta, Object.assign({ headers: {'content-type':'application/json'}, cache:'no-store' }, opt || {}));
    var j = await r.json().catch(function(){ return {}; });
    if (r.status === 401 && ruta !== 'login') { mostrarLogin(); throw new Error(j.error || 'Sesión caducada'); }
    if (!r.ok) { var e = new Error(j.error || j.aviso || 'Error'); e.status = r.status; e.data = j; throw e; }
    return j;
  }

  // sin sesión → pantalla de bienvenida (allí se pone la contraseña)
  function mostrarLogin(){ location.replace('/admin/?volver=fidelizacion'); }
  $('salir').onclick = async function(){ try { await fetch('/api/fidelidad/admin/login', { method:'DELETE' }); } catch(e){} location.replace('/admin/'); };

  async function iniciar(){
    try { await cargar(); $('panel').hidden = false; $('salir').hidden = false; }
    catch(e){ if (e.status && e.status !== 401) toast(e.message, 'mal'); }
  }

  var qBusca = '';
  async function cargar(){
    var j = await api('socios' + (qBusca ? '?q=' + encodeURIComponent(qBusca) : ''));
    OBJ = j.objetivo || OBJ; datos = j.socios; if (j.tipos && j.tipos.length) TIPOS = j.tipos;
    var s = j.stats;
    $('s-socios').textContent = s.socios; $('s-nuevos').textContent = T('+{n} esta semana', {n: s.nuevosSemana});
    $('s-hoy').textContent = s.sellosHoy; $('s-total').textContent = T('{n} en total', {n: s.sellosTotales});
    $('s-pend').textContent = s.premiosPendientes;
    $('s-canj').textContent = s.premiosCanjeados; $('s-canjhoy').textContent = T('{n} hoy', {n: s.canjesHoy});
    pintar();
  }

  function fecha(s){ if (!s) return T('nunca'); var d = new Date(s.replace(' ', 'T') + 'Z'); return d.toLocaleDateString(HK_LOCALE, {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString(HK_LOCALE, {hour:'2-digit', minute:'2-digit'}); }

  function pintar(){
    if (!datos.length) { $('lista').innerHTML = '<div class="vacio">' + (qBusca ? T('Nadie coincide con «{q}».', {q: esc(qBusca)}) : T('Todavía no hay socios. Comparte el enlace <b>hanakisushi.com/fidelidad</b>.')) + '</div>'; return; }
    $('lista').innerHTML = datos.map(function(s){
      return '<div class="soc' + (seleccionado === s.id ? ' sel' : '') + '" data-id="' + s.id + '">' +
        '<div><h3>' + esc(s.nombre) + (hayListo(s) ? '<span class="chip">' + T('PREMIO LISTO') + '</span>' : '') + '</h3>' +
        '<p>' + esc(s.telefono) + ' · ' + esc(s.codigo) + ' · ' + T('último sello:') + ' ' + fecha(s.ultimo_sello) + (s.premios ? ' · ' + T(s.premios > 1 ? '{n} premios' : '{n} premio', {n: s.premios}) : '') + '</p></div>' +
        '<div class="tipos">' + botonesTipos(s) + '</div>' +
        '<div class="acc"><button class="btn sec" data-a="enlace">' + T('ENLACE') + '</button><button class="btn sec" data-a="ficha">' + T('FICHA') + '</button></div>' +
        '</div>';
    }).join('');
  }

  // Confirma si hace falta y ejecuta la acción de un botón de tipo (sello / canjear / quitar)
  function pulsarTipo(a, s, tipo){
    if (a === 'quitar' && !confirm(T('¿Quitar un sello de {t} a {n}?', {t: nombreTipo(tipo), n: s.nombre}))) return;
    if (a === 'canjear' && !confirm(T('¿Canjear {t} de {n}? Ese contador vuelve a 0.', {t: nombreTipo(tipo), n: s.nombre}))) return;
    accion(a, { id: s.id }, tipo);
  }

  $('lista').addEventListener('click', function(e){
    var b = e.target.closest('button[data-a]'); if (!b) return;
    var id = Number(b.closest('.soc').dataset.id), s = datos.find(function(x){ return x.id === id; });
    var a = b.dataset.a;
    if (a === 'enlace') return copiarEnlace(s);
    if (a === 'ficha') return abrirFicha(id);
    pulsarTipo(a, s, b.dataset.tipo);
  });

  async function accion(a, ref, tipo, forzar){
    try {
      var j = await api('accion', { method:'POST', body: JSON.stringify(Object.assign({ accion: a, tipo: tipo, forzar: !!forzar }, ref)) });
      var s = j.socio, n = sellosDe(s, tipo), t = nombreTipo(tipo); seleccionado = s.id;
      if (a === 'sello') toast(T('✓ Sello de {t} para {n} · {s}/{o}', {t: t, n: s.nombre, s: n, o: OBJ}) + (n >= OBJ ? T(' — ¡PREMIO CONSEGUIDO!') : ''), 'ok');
      else if (a === 'canjear') toast(T('✓ Premio canjeado. {n} empieza de nuevo.', {n: s.nombre}), 'ok');
      else toast(T('Sello de {t} quitado. {n} · {s}/{o}', {t: t, n: s.nombre, s: n, o: OBJ}));
      if (navigator.vibrate) navigator.vibrate(60);
      await cargar();
    } catch(e){
      if (e.status === 409 && e.data && e.data.aviso) { if (confirm(T(e.data.aviso))) return accion(a, ref, tipo, true); return; }
      toast(e.message, 'mal');
    }
  }

  function copiarEnlace(s){
    var url = location.origin + '/fidelidad/tarjeta.html?t=' + s.token;
    var txt = 'Hola ' + s.nombre + ', esta es tu tarjeta de fidelidad de Hanaki: ' + url;
    if (navigator.share) return navigator.share({ title: 'Tarjeta Hanaki', text: txt }).catch(function(){});
    navigator.clipboard.writeText(url).then(function(){ toast('Enlace copiado. Envíaselo por WhatsApp.', 'ok'); }, function(){ prompt(T('Enlace de la tarjeta:'), url); });
  }

  var tb; $('buscar').addEventListener('input', function(){ clearTimeout(tb); tb = setTimeout(function(){ qBusca = $('buscar').value.trim(); cargar().catch(function(){}); }, 250); });

  $('exportar').onclick = function(){
    var filas = [['nombre','telefono','email','codigo','sellos_mediodia','sellos_noche','sellos_menu','sellos_totales','premios','acepta_promos','alta','ultimo_sello']].concat(datos.map(function(s){
      return [s.nombre, s.telefono, s.email || '', s.codigo, s.sellos_mediodia || 0, s.sellos_noche || 0, s.sellos_menu || 0, s.sellos_totales, s.premios, s.acepta_promos ? 'si' : 'no', s.creado, s.ultimo_sello || ''];
    }));
    var csv = '﻿' + filas.map(function(f){ return f.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(';'); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'socios-hanaki.csv'; a.click();
  };


  // ---------- ficha del cliente ----------
  var fichaId = null;
  function fechaLarga(s){ if (!s) return '–'; var d = new Date(s.replace(' ', 'T') + 'Z'); return d.toLocaleDateString(HK_LOCALE, {day:'numeric', month:'short', year:'numeric'}) + ' · ' + d.toLocaleTimeString(HK_LOCALE, {hour:'2-digit', minute:'2-digit'}); }
  var TIPO = { sello: '+1 sello', quitar: '−1 sello', canje: 'Premio canjeado' };
  async function abrirFicha(id){
    try {
      var j = await api('socio?id=' + id), s = j.socio, mov = j.movimientos || [];
      fichaId = s.id;
      $('f-nombre').textContent = s.nombre;
      var fila = function(k, v){ return '<dt>' + T(k) + '</dt><dd>' + v + '</dd>'; };
      $('f-datos').innerHTML =
        fila('TELÉFONO', '<a href="tel:' + esc(s.telefono) + '">' + esc(s.telefono) + '</a>') +
        fila('EMAIL', s.email ? '<a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a>' : '–') +
        fila('ALTA', fechaLarga(s.creado)) +
        fila('CÓDIGO', esc(s.codigo)) +
        fila('SELLOS', T('{n} en total', {n: s.sellos_totales})) +
        fila('PREMIOS', String(s.premios)) +
        fila('PROMOS', s.acepta_promos ? T('Sí') : T('No'));
      $('f-tipos').innerHTML = TIPOS.map(function(t){
        var n = sellosDe(s, t.id);
        return '<div class="fila"><span>' + esc(nombreTipo(t.id)) + ' · <b>' + n + '/' + OBJ + '</b></span><button type="button" class="btn sec" data-q="' + esc(t.id) + '"' + (n ? '' : ' disabled') + '>−1</button></div>';
      }).join('');
      $('f-nmov').textContent = mov.length ? String(mov.length) : '';
      $('f-hist').innerHTML = mov.length ? mov.map(function(m){
        return '<li><span class="t-' + esc(m.tipo) + '">' + T(TIPO[m.tipo] || m.tipo) + (m.tipo_sello ? ' · ' + nombreTipo(m.tipo_sello) : '') + '</span><time>' + fechaLarga(m.creado) + '</time></li>';
      }).join('') : '<li><span style="color:var(--muted)">' + T('Todavía no tiene sellos.') + '</span></li>';
      $('ficha').hidden = false;
    } catch(e){ toast(e.message, 'mal'); }
  }
  function cerrarFicha(){ $('ficha').hidden = true; fichaId = null; }
  $('f-cerrar').onclick = cerrarFicha;
  $('ficha').addEventListener('click', function(e){ if (e.target === $('ficha')) cerrarFicha(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('ficha').hidden) cerrarFicha(); });
  $('f-tipos').addEventListener('click', async function(e){
    var b = e.target.closest('button[data-q]'); if (!b || fichaId == null) return;
    var id = fichaId, s = datos.find(function(x){ return x.id === id; }) || { nombre: $('f-nombre').textContent };
    if (!confirm(T('¿Quitar un sello de {t} a {n}?', {t: nombreTipo(b.dataset.q), n: s.nombre}))) return;
    await accion('quitar', { id: id }, b.dataset.q);
    abrirFicha(id);
  });
  $('f-borrar').onclick = async function(){
    var s = datos.find(function(x){ return x.id === fichaId; }), nombre = s ? s.nombre : $('f-nombre').textContent;
    if (!confirm(T('¿Borrar a {n} y todo su historial? No se puede deshacer.', {n: nombre}))) return;
    try {
      await api('socio', { method: 'DELETE', body: JSON.stringify({ id: fichaId }) });
      cerrarFicha(); toast(T('{n} borrado.', {n: nombre}), 'ok'); await cargar();
    } catch(e){ toast(e.message, 'mal'); }
  };

  // ---------- escáner de QR ----------
  var stream, bucle, detector, jsqrListo;
  $('escanear').onclick = async function(){
    $('cam').hidden = false; $('cam-msg').textContent = T('Apunta al QR de la tarjeta del cliente');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      var v = $('video'); v.srcObject = stream; await v.play();
      if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch(e){ detector = null; } }
      if (!detector && !jsqrListo) await cargarJsQR();
      leer();
    } catch(e){ $('cam-msg').textContent = T('No se pudo abrir la cámara. Busca al cliente por nombre, teléfono o código.'); }
  };
  function cargarJsQR(){ return new Promise(function(ok, ko){ var s = document.createElement('script'); s.src = 'vendor/jsQR.js'; s.onload = function(){ jsqrListo = true; ok(); }; s.onerror = ko; document.head.appendChild(s); }); }
  var lienzo = document.createElement('canvas'), ctx = lienzo.getContext('2d', { willReadFrequently: true });
  async function leer(){
    var v = $('video'); if (!stream) return;
    var texto = null;
    try {
      if (detector) { var r = await detector.detect(v); if (r[0]) texto = r[0].rawValue; }
      else if (v.videoWidth) {
        var w = 480, h = Math.round(v.videoHeight * w / v.videoWidth); lienzo.width = w; lienzo.height = h;
        ctx.drawImage(v, 0, 0, w, h); var c = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' }); if (c) texto = c.data;
      }
    } catch(e){}
    if (texto) return encontrado(texto);
    bucle = requestAnimationFrame(leer);
  }
  function cerrarCam(){ cancelAnimationFrame(bucle); if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; $('cam').hidden = true; }
  $('cerrar-cam').onclick = cerrarCam;

  async function encontrado(texto){
    var token = null;
    try { token = new URL(texto).searchParams.get('t'); } catch(e){ if (/^[a-f0-9]{32}$/.test(texto)) token = texto; }
    if (!token) { $('cam-msg').textContent = T('Ese QR no es una tarjeta Hanaki.'); bucle = requestAnimationFrame(leer); return; }
    cerrarCam();
    try {
      var j = await api('socio?token=' + encodeURIComponent(token)), s = j.socio;
      seleccionado = s.id; $('buscar').value = ''; qBusca = '';
      await cargar();
      abrirSellar(s);
    } catch(e){ toast(e.message, 'mal'); }
  }

  // Hoja para elegir qué ha tomado el cliente (se abre al escanear su QR)
  var sellando = null;
  function abrirSellar(s){ sellando = s; $('s-nombre').textContent = s.nombre; $('s-tipos').innerHTML = botonesTipos(s); $('sellar').hidden = false; }
  function cerrarSellar(){ $('sellar').hidden = true; sellando = null; }
  $('s-cerrar').onclick = cerrarSellar;
  $('sellar').addEventListener('click', function(e){ if (e.target === $('sellar')) cerrarSellar(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('sellar').hidden) cerrarSellar(); });
  $('s-tipos').addEventListener('click', function(e){
    var b = e.target.closest('button[data-a]'); if (!b || !sellando) return;
    var s = sellando; cerrarSellar(); pulsarTipo(b.dataset.a, s, b.dataset.tipo);
  });

  iniciar();
})();
</script>
</body>
</html>
